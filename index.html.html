<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiotour Veghel postaal en sociaal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #1a365d;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 16px;
            color: #4a5568;
            margin-top: 5px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .selector-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }
        .arrow-btn {
            background-color: #e2e8f0;
            border: none;
            color: #2d3748;
            font-size: 28px;
            padding: 10px 30px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        .arrow-btn:active {
            background-color: #cbd5e0;
        }
        .number-display {
            font-size: 72px;
            font-weight: bold;
            color: #2b6cb0;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .hint {
            font-size: 14px;
            color: #718096;
            margin-top: 15px;
            margin-bottom: 20px;
            font-style: italic;
        }
        .go-btn {
            background-color: #48bb78;
            color: white;
            border: none;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 60px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(72, 187, 120, 0.3);
            transition: transform 0.1s, background-color 0.2s;
            width: 80%;
        }
        .go-btn:active {
            transform: scale(0.97);
            background-color: #38a169;
        }
        audio {
            margin-top: 25px;
            width: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Audiotour bij Veghel postaal en sociaal</h1>
        <div class="subtitle">Maak uw keuze voor pagina</div>

        <div class="selector-box">
            <button class="arrow-btn" onclick="changeNumber(1)">▲</button>
            <div class="number-display" id="display">01</div>
            <button class="arrow-btn" onclick="changeNumber(-1)">▼</button>
        </div>

        <div class="hint">Graag luisteren via oortjes</div>

        <button class="go-btn" onclick="playAudio()">GO</button>
        
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        let currentNumber = 1;

        function changeNumber(amount) {
            currentNumber += amount;
            if (currentNumber > 36) currentNumber = 1;
            if (currentNumber < 1) currentNumber = 36;
            
            document.getElementById('display').innerText = currentNumber.toString().padStart(2, '0');
        }

        function playAudio() {
            const formattedNumber = currentNumber.toString().padStart(2, '0');
            const player = document.getElementById('audioPlayer');
            
            // Dit zoekt naar opname_01.mp3, opname_02.mp3 etc.
            player.src = `opname_${formattedNumber}.mp3`;
            player.style.display = 'block';
            player.play();
        }
    </script>

</body>
</html>
